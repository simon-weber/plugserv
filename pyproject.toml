[project]
name = "plugserv"
version = "0.0.1"
requires-python = ">= 3.9"
dependencies = [
    "django",
    "django-allauth",
    "django-amazon-ses",
    "django-bootstrap-form",
    "django-crispy-forms",
    "djangorestframework",
    "google-measurement-protocol",
    "gunicorn[gevent]",
    "s3cmd",
    "sentry-sdk",
    "tldextract",
]

[dependency-groups]
dev = [
    "pre-commit",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and implementation_name == 'cpython'",
]
